<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — The Welding Brothers</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'DM Sans',-apple-system,sans-serif;
    background:#1A1A1A;
    color:#FFF;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;text-align:center;padding:20px;
  }
  .e404{max-width:500px}
  .e404 h1{font-family:'Oswald',sans-serif;font-size:6rem;color:#2979C1;line-height:1;margin-bottom:8px}
  .e404 h2{font-family:'Oswald',sans-serif;font-size:1.5rem;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:16px}
  .e404 p{color:rgba(255,255,255,0.6);margin-bottom:32px;line-height:1.6}
  .e404 a{
    display:inline-block;background:#2979C1;color:#FFF;
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;
    padding:14px 28px;border-radius:4px;transition:box-shadow .3s,transform .3s;
  }
  .e404 a:hover{box-shadow:0 0 24px rgba(41,121,193,0.5);transform:translateY(-2px)}
</style>
</head>
<body>
<div class="e404">
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page you're looking for doesn't exist. It might have been moved, or you might've followed a bad link.</p>
  <a href="/">Back to Home</a>
</div>
</body>
</html>
