<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* --- Nav Glass --- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(17,17,17,0.82);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,0.06);
  padding:0 20px;height:68px;
}
.nav-inner{
  max-width:1280px;margin:0 auto;height:100%;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-brand{
  display:flex;align-items:center;gap:12px;text-decoration:none;
}
.nav-logo-img{width:40px;height:40px;border-radius:6px}
.nav-logo-text{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:1rem;
  color:#FFFFFF;letter-spacing:1px;white-space:nowrap;
}
.nav-phone{
  display:flex;align-items:center;gap:8px;
  font-family:'Oswald',sans-serif;font-weight:600;font-size:1.05rem;
  color:#FFFFFF;text-decoration:none;
  background:#2979C1;padding:8px 18px;border-radius:6px;
  transition:background 0.2s;
}
.nav-phone:hover{background:#3388D0}
.nav-phone svg{width:18px;height:18px;flex-shrink:0}
@media(max-width:520px){
  .nav-logo-text{display:none}
}

/* --- Body --- */
body{
  font-family:'DM Sans',-apple-system,sans-serif;
  background:#1A1A1A;
  color:#FFFFFF;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:88px 20px 40px;
}
.container{max-width:600px;margin:0 auto}

/* --- Check Icon --- */
.check-circle{
  width:72px;height:72px;
  border:3px solid #2979C1;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 28px;
}
.check-circle svg{width:32px;height:32px;stroke:#2979C1}

h1{
  font-family:'Oswald',sans-serif;
  font-size:clamp(1.75rem,5vw,2.75rem);font-weight:700;
  text-transform:uppercase;line-height:1.1;margin-bottom:16px;
}
.sub{font-size:1.05rem;color:#8A8A8A;line-height:1.6;margin-bottom:14px}
.phone-inline{font-size:1.5rem;font-weight:700;color:#2979C1;text-decoration:none}
.phone-inline:hover{color:#3388D0}
.bilingual{margin-top:20px;font-size:0.85rem;color:#555}

/* --- Orange Pulse Button --- */
.btn-back-wrap{margin:32px 0 8px}
.btn-back{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;
  text-transform:uppercase;letter-spacing:0.5px;
  color:#FFFFFF;
  background:#FF6B35;
  padding:14px 32px;
  border-radius:8px;
  text-decoration:none;
  animation:btn-pulse 2.4s ease-in-out infinite;
  transition:background 0.2s;
}
.btn-back:hover{background:#FF7F50}
.btn-back svg{width:20px;height:20px;flex-shrink:0}

@keyframes btn-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,0.55)}
  50%{box-shadow:0 0 0 16px rgba(255,107,53,0)}
}

/* --- Mobile --- */
@media(max-width:480px){
  .btn-back{padding:14px 24px;font-size:0.95rem}
}
