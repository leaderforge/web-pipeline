<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — MedillaForms</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: '"Plus Jakarta Sans"', system-ui, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-family: '"Clash Display"', '"Plus Jakarta Sans"', sans-serif;
    font-size: clamp(4rem, 10vw, 8rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #14b8a6;
    line-height: 1;
    margin-bottom: 0.5rem;
  }
  h2 {
    font-family: '"Clash Display"', '"Plus Jakarta Sans"', sans-serif;
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 1rem;
    color: #f8fafc;
  }
  p {
    color: #94a3b8;
    font-size: 1rem;
    line-height: 1.6;
    max-width: 400px;
    margin: 0 auto 2rem;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: #14b8a6;
    color: white;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.875rem 2rem;
    border-radius: 2rem;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 24px rgba(20,184,166,0.25);
  }
  .btn:hover {
    background: #0d9488;
    transform: translateY(-1px);
    box-shadow: 0 6px 32px rgba(20,184,166,0.35);
  }
</style>
</head>
<body>

<div>
  <h1>404</h1>
  <h2>Página no encontrada</h2>
  <p>
    La página que buscas no existe o fue movida.
    Pero tu factura médica sí existe — y probablemente tiene errores.
  </p>
  <a href="/" class="btn">
    <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/></svg>
    Ir al inicio
  </a>
</div>
