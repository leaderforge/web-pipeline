<!-- Meta Pixel -->
<script>

<style>
  :root {
    --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: '"Plus Jakarta Sans"', system-ui, sans-serif;
    background: #faf8f5;
    color: #0f172a;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: white;
    border-radius: 2rem;
    padding: 3rem 2rem;
    max-width: 480px;
    width: 100%;
    box-shadow:
      0 1px 2px rgba(0,0,0,0.02),
      0 4px 16px rgba(0,0,0,0.03),
      0 16px 48px rgba(0,0,0,0.04);
    animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .checkmark {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #14b8a6;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    animation: scaleIn 0.5s cubic-bezier(0.32, 0.72, 0, 1) 0.2s both;
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }
  .checkmark svg {
    width: 36px;
    height: 36px;
    stroke: white;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  h1 {
    font-family: '"Clash Display"', '"Plus Jakarta Sans"', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.75rem;
    color: #0f172a;
  }
  p {
    color: #64748b;
    line-height: 1.6;
    font-size: 1rem;
    margin-bottom: 1.5rem;
  }
  .phone-highlight {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: #f0fdfa;
    border: 1px solid #99f6e4;
    border-radius: 2rem;
    padding: 0.75rem 1.5rem;
    font-size: 1.1rem;
    font-weight: 600;
    color: #0d9488;
    text-decoration: none;
    transition: all 0.3s var(--ease-spring);
    margin-bottom: 2rem;
  }
  .phone-highlight:hover {
    background: #ccfbf1;
    transform: scale(1.02);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: #0d9488;
    color: white;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.875rem 2rem;
    border-radius: 2rem;
    text-decoration: none;
    transition: all 0.3s var(--ease-spring);
    box-shadow: 0 4px 24px rgba(13,148,136,0.25);
  }
  .btn:hover {
    background: #0f766e;
    transform: translateY(-1px);
    box-shadow: 0 6px 32px rgba(13,148,136,0.35);
  }
</style>
</head>
<body>

<div class="card">
  <div class="checkmark">
    <svg viewBox="0 0 24 24">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </div>

  <h1>¡Listo! Recibimos tu factura.</h1>
  <p>
    Nuestro equipo la está analizando ahora mismo.
    Te mandaremos los resultados por WhatsApp en menos de 5 minutos.
  </p>

  <a href="tel:+1XXXXXXXXXX" class="phone-highlight">  <!-- TODO: Replace with real phone -->
    <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M222,158.4l-46.9-20a15.6,15.6,0,0,0-15.1,1.3l-25.1,16.7a76.5,76.5,0,0,1-35.2-35h0L116.4,96a15.8,15.8,0,0,0,1.4-15.1L97.6,34a15.7,15.7,0,0,0-16.8-9.1A56.2,56.2,0,0,0,32,80c0,79.4,64.6,144,144,144a56.2,56.2,0,0,0,55.1-48.8A15.7,15.7,0,0,0,222,158.4Z"/></svg>
    (XXX) XXX-XXXX
  </a>

  <br>
  <a href="/" class="btn">
    <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/></svg>
    Volver al inicio
  </a>
</div>

<!-- Conversion Tracking -->
<script>
  // GA4 conversion event
  gtag('event', 'conversion', {
    'send_to': 'AW-CONVERSION_ID/thank-you' // TODO: Replace with Google Ads conversion ID
  });

  // Meta Pixel conversion event
  fbq('track', 'Lead', {
    content_name: 'medillaforms_thank_you',
    content_category: 'conversion'
  });

  // Fires 2 seconds after page load to ensure scripts are ready
  setTimeout(function() {
    console.log('✅ Conversion tracked: Lead + PageView');
  }, 2000);
</script>

</body>
</html>
